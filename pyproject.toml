[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashback"
version = "0.1.0"
description = "A plain-text, spaced-repetition flashcard tool for the terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daily Amnesia" }]

[project.urls]
Homepage = "https://github.com/dailyamnesia/project"

[project.scripts]
flashback = "flashback.cli:main"

[tool.setuptools.packages.find]
include = ["flashback*"]
